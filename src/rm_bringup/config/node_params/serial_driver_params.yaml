/**:
  ros__parameters:
    target_frame: odom
    child_frame_id: gimbal_link
    timestamp_offset: 0.000
    max_timestamp_age: 0.200
    port_name: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"  # 使用固定设备标识，避免插拔后编号变化
    # float32 弧度：发送40/接收32字节，0xFE帧头；视觉与电控波特率须一致
    baud_rate: 921600
    protocol: "infantry"  # ProtocolInfantry: infantry, DefaultProtocol: hero air, ProtocolSentry: sentry
    enable_data_print: false # 改为true将会打印从串口读出来的16进制数据

