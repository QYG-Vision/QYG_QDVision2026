/**:
  ros__parameters:
    debug: true
    armor_solver.result_img.jpeg_quality: 50  # 结果图像的jpeg压缩质量，0-100，数值越大质量越好，文件也越大
    target_frame: odom
    gimble_frame: gimbal_link
    max_armor_distance: 10.0
    filter_reset_dt_thres: 1.0
    enable_solveYawPnp: true  #三分法求yaw

    ekf:
      lmtd_top_model:
        q_pos_v: 100.0
        q_orientation_yaw_v: 400.0

      armor_model:
        q_x: 0.01
        q_v: 20.0

        r_yaw: 1.0
        r_pitch: 1.5 
        r_distance: 50.0

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 0.7

      tracking_thres: 2
      lost_time_thres: 0.3
          
    solver:
      use_armor_top: true            # 兼容旧参数；当前济瞄 MPC 路径统一使用整车候选板
      use_ballistic_compensation: true # 只切换发射 pitch；关闭时用几何角，飞行时间预测不变
      predict2send_delay: 0.17         # 从预测到串口发送的延迟
      controller_delay: 0.0           # 开火延迟
      additional_prediction_time: 0.00 # MPC目标时域额外前移s，只应用一次，不在输出端再叠加速度
      shooting_range_width: 0.135     # 开火宽度范围
      shooting_range_height: 0.135    # 开火高度范围
      compensator_type: "ceres" # ideal(仅重力) resistance(阻力近似) ceres(ceres线阻力) rk4(四阶龙格库塔)
      gravity: 9.8       #重力加速度
      resistance: 0.022928514188   #空气阻力
      iteration_times: 20 # 补偿的迭代次数 暂时没用到
      rk4:
        time_step: 0.003
        max_steps: 8000
        hit_distance_threshold: 0.02

      # 与同济 Planner 对齐：10 ms 步长、100 点窗口，输出窗口中点。
      mpc:
        enabled: true
        horizon: 100
        dt: 0.01
        position_weight: 9000000.0
        velocity_weight: 0.0
        acceleration_weight: 1.0
        fire_thresh_min: 0.00        # 第52点两轴规划误差范数下限，rad，含边界
        fire_thresh: 0.03          # 同济 Planner：第52点两轴规划误差范数，rad
        max_iterations: 100
        feedback_timeout: 0.1       # 可达选板要求反馈年龄不超过此值，s
        target_timeout: 0.3         # 兼容旧参数；目标有效性由 tracking 判定
        yaw:
          max_acceleration: 15.0 # rad/s²
        pitch:
          max_acceleration: 100.0 # rad/s²

      # 加速度模型下的预测选板；不限制最大角速度，参数为待回放/实机调整的试验值。
      selection:
        policy: acceleration_reachable # nearest_distance 可恢复逐点最近板策略
        dt: 0.01                       # 评估步长，固定 10 ms
        horizon: 0.50                  # 命令参考时刻之后的评估时长，s，最大 2 s
        capture_deadline: 0.30          # 最迟允许对准时间，s
        hold_time: 0.10                 # 最短连续可攻击时长，s
        angle_tolerance: 0.02           # 当前两轴各自允许的对准误差，rad
        velocity_tolerance: 0.10        # 当前两轴各自允许的角速度误差，rad/s
        max_facing_angle_deg: 60.0      # 预测命中时板面偏离正面中心的最大夹角，deg
        switch_improvement: 0.20        # 捕获评分或未出发接管时间的最小改善比例
        switch_hold_time: 0.05          # 改善持续时间，s；已出发转移保持接管目标
        handoff:
          max_transfer_time: 0.30       # 单次板间转移的最长时间，s
          window_margin: 0.02           # 离开当前窗口及下一板窗口边缘的余量，s

      # ["距离下限, 距离上限, 高度下限, 高度上限, pitch轴补偿°, yaw轴补偿°"]
      # 原弧度值换成配置角度：degree = rad × 180 / π；读取时转回 rad = degree × π / 180
      # 目标相对于odom
      angle_offset: [
        "0.0 6.0 -1.0 1.0 0.0 0.0",
                         

      ]
