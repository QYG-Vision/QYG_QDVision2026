/**:
  ros__parameters:
    debug: true
    armor_solver.result_img.jpeg_quality: 50  # 结果图像的jpeg压缩质量，0-100，数值越大质量越好，文件也越大
    target_frame: odom
    gimble_frame: gimbal_link
    max_armor_distance: 10.0
    filter_reset_dt_thres: 1.0
    enable_solveYawPnp: true  #三分法求yaw

    ekf:
      lmtd_top_model:
        q_pos_v: 100.0
        q_orientation_yaw_v: 400.0

      armor_model:
        q_x: 0.01
        q_v: 20.0

        r_yaw: 1.0
        r_pitch: 1.5 
        r_distance: 50.0

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 0.7

      tracking_thres: 2
      lost_time_thres: 0.3

      # 直接参与匹配预测和下游旋转输出；关闭后恢复原 EKF，a_yaw=0。
      imm:
        enabled: true
        # slow / constant / variable，行优先，每行之和为 1。
        transition: [0.93, 0.05, 0.02, 0.04, 0.93, 0.03, 0.03, 0.07, 0.90]
        r_yaw: 0.06  # 姿态朝向观测方差，rad²；需按本机数据调整。
        # 沿用杭电离散步噪声；与实际帧率有关，不是主 EKF 的 q_orientation_yaw_v。
        q_v_slow: 0.08
        q_v_constant: 0.02
        q_v_variable: 0.20
        q_alpha_slow: 0.10
        q_alpha_constant: 0.05
        q_alpha_variable: 0.80
        # 每个预测步保留的 alpha 比例；越小回零越快。
        alpha_decay_slow: 0.2
        alpha_decay_constant: 0.5
        dt_min: 0.001  # 参数合法性下限，实际短 dt 不会被强行放大。
        dt_max: 0.2    # 大间隔分步推进，保留全部实际经过时间。
        mu_min: 0.0001
        nis_gate: 9.0
          
    solver:
      use_armor_top: true            # 兼容旧参数；当前济瞄 MPC 路径统一使用整车候选板
      use_ballistic_compensation: true # 只切换发射 pitch；关闭时用几何角，飞行时间预测不变
      predict2send_delay: 0.17         # 从预测到串口发送的延迟
      controller_delay: 0.0           # 开火延迟
      additional_prediction_time: 0.00 # MPC目标时域额外前移s，只应用一次，不在输出端再叠加速度
      shooting_range_width: 0.135     # 开火宽度范围
      shooting_range_height: 0.135    # 开火高度范围
      compensator_type: "ceres" # ideal(仅重力) resistance(阻力近似) ceres(ceres线阻力) rk4(四阶龙格库塔)
      gravity: 9.8       #重力加速度
      resistance: 0.022928514188   #空气阻力
      iteration_times: 20 # 补偿的迭代次数 暂时没用到
      rk4:
        time_step: 0.003
        max_steps: 8000
        hit_distance_threshold: 0.02

      # 与同济 Planner 对齐：10 ms 步长、100 点窗口，输出窗口中点。
      mpc:
        enabled: true
        horizon: 100
        dt: 0.01
        position_weight: 9000000.0
        velocity_weight: 0.0
        acceleration_weight: 1.0
        fire_thresh: 0.003          # 同济 Planner：第52点两轴规划误差范数，rad
        max_iterations: 10
        feedback_timeout: 0.1       # 兼容旧参数；济瞄规划路径不以反馈年龄阻断输出
        target_timeout: 0.3         # 兼容旧参数；目标有效性由 tracking 判定
        yaw:
          max_acceleration: 250.788976  # degree/s²，对应同济 50 rad/s² 2864.788976
        pitch:
          max_acceleration: 5729.577951  # degree/s²，对应同济 100 rad/s²

      # ["距离下限, 距离上限, 高度下限, 高度上限, pitch轴补偿值，yaw轴补偿值"]
      # 目标相对于odom
      angle_offset: [
        "0.0 6.0 -1.0 1.0 2.3 1.2",
                         

      ]
