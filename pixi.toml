[workspace]
channels = ["robostack-humble", "conda-forge"]
name = "rmvision"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = '''
ENV_LIB_PATH=$(python -c "import sys; print(sys.prefix)")/lib && \
export LIBRARY_PATH="${ENV_LIB_PATH}:${LIBRARY_PATH}" && \
colcon build --symlink-install --parallel-workers 4 \
  --cmake-args \
    -DPython_EXECUTABLE=$(which python) \
    -DPython3_EXECUTABLE=$(which python) \
    -DPython3_NumPy_INCLUDE_DIR=$(python -c "import numpy; print(numpy.get_include())") \
    -DPython_NumPy_INCLUDE_DIR=$(python -c "import numpy; print(numpy.get_include())") \
    -DPython3_FIND_STRATEGY=LOCATION \
    -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined -L${ENV_LIB_PATH}" \
    -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--allow-shlib-undefined -L${ENV_LIB_PATH}" \
    -DCMAKE_CXX_FLAGS="-include cstdint"
'''

[activation]
scripts = ["install/setup.sh"]

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
ros-humble-foxglove-bridge = ">=3.3.0,<4"
colcon-common-extensions = ">=0.3.0,<0.4"

ros-humble-asio-cmake-module = ">=1.2.0,<2"
ros-humble-vision-opencv = ">=3.2.1,<4"
ros-humble-camera-info-manager = ">=3.1.12,<4"
ros-humble-camera-calibration-parsers = ">=3.1.12,<4"
ros-humble-camera-calibration = ">=3.0.9,<4"
ros-humble-serial-driver = ">=1.2.0,<2"
ros-humble-udp-msgs = ">=0.0.5,<0.0.6"
ros-humble-io-context = ">=1.2.0,<2"
ros-humble-ament-cmake-clang-format = ">=0.12.15,<0.13"
ros-humble-angles = ">=1.15.0,<2"
ros-humble-image-transport = ">=3.1.12,<4"
ros-humble-image-transport-plugins = ">=2.5.5,<3"
ros-humble-tf-transformations = ">=1.1.1,<2"
ros-humble-xacro = ">=2.1.1,<3"
ros-humble-rosbag2-storage-mcap = ">=0.15.16,<0.16"
ros-humble-plotjuggler = ">=3.15.0,<4"
ros-humble-plotjuggler-ros = ">=2.3.1,<3"

openvino = ">=2026.0.0,<2027"

python = ">=3.12.13,<3.13"
numpy = ">=2.3.5,<3"
setuptools = "*"

pkg-config = "*"
cmake = "<4.0"
ceres-solver = ">=2.2.0,<3"
tbb-devel = ">=2022.3.0,<2023"
tbb = ">=2022.3.0,<2023"
opencv = ">=4.13.0,<5"
eigen = ">=3.4.0,<4"
fmt = ">=12.1.0,<13"
