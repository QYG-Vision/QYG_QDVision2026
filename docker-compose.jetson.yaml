# 与主配置合并：docker compose -f docker-compose.yaml -f docker-compose.jetson.yaml up -d --build
services:
  rv_devel:
    build:
      args:
        # CPU 验证使用原生 ARM64 Ubuntu；GPU 构建时显式指定已验证的 JetPack 开发镜像。
        BASE_IMAGE: ${JETSON_BASE_IMAGE:-ubuntu:22.04}
        THREADS: "2"
    image: qyg-vision:jetson-jp6
    platform: linux/arm64
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      RM_VISION_PROFILE: jetson
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    shm_size: 1gb
